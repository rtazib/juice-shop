name: SCA - Software Composition Analysis

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "0 6 * * 1"  # Elke maandag om 06:00 UTC

jobs:
  sca-scan:
    name: Trivy SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          vuln-type: "library"
          severity: "HIGH,CRITICAL"
          exit-code: "1"        # Pipeline blokkeert bij vulnerabilities
          format: "table"
          ignore-unfixed: true
