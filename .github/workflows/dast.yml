name: DAST - ZAP Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  zap-scan:
    name: ZAP DAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Start Juice Shop
        run: |
          npm start &
          sleep 45

      - name: Install Nikto (DAST scanner)
        run: sudo apt-get install -y nikto

      - name: Run Nikto DAST scan
        run: |
          nikto -h http://localhost:3000 -o nikto-report.txt -Format txt
          cat nikto-report.txt
          exit 1
